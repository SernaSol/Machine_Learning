
name: Ejecutar Actividad 2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ejecutar-main
  cancel-in-progress: false

jobs:
  ejecutar-actividad2:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      MPLBACKEND: Agg

    steps:
      # 1. Descargar repositorio
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 2. Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # 3. Crear entorno virtual
      - name: Crear entorno virtual
        run: python -m venv .venv

      # 4. Instalar dependencias
      - name: Instalar dependencias
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install \
            pyarrow openpyxl matplotlib-inline

      # 5. Verificar Matplotlib
      - name: Verificar Matplotlib
        run: |
          .venv/bin/python - <<'PY'
          import matplotlib
          import matplotlib.pyplot as plt

          print("Version Matplotlib:", matplotlib.__version__)

          fig, ax = plt.subplots(figsize=(8, 5))
          ax.plot([1, 2, 3], [1, 4, 9])
          plt.close(fig)

          print("Matplotlib funciona correctamente")
          PY

      # 6. Configurar kernel Jupyter
      - name: Configurar kernel Jupyter
        run: |
          .venv/bin/python -m ipykernel install \
            --user \
            --name actividad2 \
            --display-name "Python Actividad 2"

      # 7. Limpiar resultados previos del runner
      - name: Limpiar resultados anteriores
        run: |
          mkdir -p src/carga_datos/entrenamiento
          rm -f src/carga_datos/resumen_modelos_actividad2.txt

          find src/carga_datos/entrenamiento \
            -type f -name "*.pkl" -delete

          echo "Resultados anteriores limpiados del runner"

      # 8. Ejecutar notebook completo
      - name: Ejecutar modelos de la Actividad 2
        working-directory: src/carga_datos
        run: |
          ../../.venv/bin/python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          notebooks = list(Path(".").glob("EA2_*.ipynb"))

          if len(notebooks) != 1:
              raise RuntimeError(
                  "Se esperaba un notebook de Actividad 2. "
                  f"Encontrados: {notebooks}"
              )

          notebook = notebooks[0]
          print("Ejecutando:", notebook, flush=True)

          subprocess.run(
              [
                  sys.executable,
                  "-m", "jupyter", "nbconvert",
                  "--to", "notebook",
                  "--execute",
                  "--ExecutePreprocessor.timeout=1800",
                  "--ExecutePreprocessor.kernel_name=actividad2",
                  "--output", "EA2_ejecutado.ipynb",
                  str(notebook),
              ],
              check=True,
          )

          print("Notebook ejecutado correctamente")
          PY

      # 9. Verificar modelos nuevos
      - name: Verificar modelos generados
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path

          carpeta = Path("src/carga_datos/entrenamiento")

          regresiones = sorted(carpeta.glob("*_modelo.pkl"))
          clasificaciones = sorted(
              carpeta.glob("*_clasificacion.pkl")
          )

          print("Modelos de regresion:")
          for archivo in regresiones:
              print(archivo.name)

          print("Modelos de clasificacion:")
          for archivo in clasificaciones:
              print(archivo.name)

          if not regresiones:
              raise RuntimeError(
                  "No se genero ningun modelo de regresion"
              )

          if not clasificaciones:
              raise RuntimeError(
                  "No se genero ningun modelo de clasificacion"
              )

          print("Modelos generados correctamente")
          PY

      # 10. Verificar resumen
      - name: Verificar resumen automatico
        run: |
          test -s src/carga_datos/resumen_modelos_actividad2.txt
          echo "Resumen generado correctamente"
          cat src/carga_datos/resumen_modelos_actividad2.txt

      # 11. Publicar artefactos
      - name: Publicar resultados de Actividad 2
        uses: actions/upload-artifact@v4
        with:
          name: resultados-actividad2
          path: |
            src/carga_datos/resumen_modelos_actividad2.txt
            src/carga_datos/EA2_ejecutado.ipynb
            src/carga_datos/entrenamiento/*.pkl
          if-no-files-found: error
          retention-days: 30

      # 12. Guardar resultados en GitHub
      - name: Guardar modelos y resumen en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f \
            src/carga_datos/resumen_modelos_actividad2.txt

          find src/carga_datos/entrenamiento \
            -type f -name "*.pkl" \
            -exec git add -f -- {} +

          echo "Archivos preparados:"
          git diff --cached --name-only

          if git diff --cached --quiet; then
            echo "No hay archivos nuevos para guardar"
            exit 0
          fi

          git commit -m \
            "chore: actualizar modelos y resumen actividad 2 [skip ci]"

          # Guardar cambios temporales no incluidos en el commit
          # para que no bloqueen el rebase.
          git stash push --include-untracked \
            -m "Cambios temporales del runner"

          # Integrar posibles commits de otros workflows
          git fetch origin main
          git rebase origin/main

          # Publicar los modelos y el resumen
          git push origin HEAD:main

          echo "Modelos y resumen guardados en GitHub"
