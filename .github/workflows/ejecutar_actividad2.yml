
name: Ejecutar Actividad 2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ejecutar-actividad2:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Descargar el repositorio
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # 3. Crear entorno virtual
      - name: Crear entorno virtual
        run: python -m venv .venv

      # 4. Instalar dependencias
      - name: Instalar dependencias
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install pyarrow openpyxl

      # 5. Verificar Matplotlib
      - name: Verificar Matplotlib
        env:
          MPLBACKEND: Agg
        run: |
          .venv/bin/python - <<'PY'
          import matplotlib
          import matplotlib.pyplot as plt

          print("Version:", matplotlib.__version__)

          fig, ax = plt.subplots(figsize=(8, 5))
          ax.plot([1, 2, 3], [1, 4, 9])
          plt.close(fig)

          print("Grafica creada correctamente")
          PY

      # 6. Configurar kernel de Jupyter
      - name: Configurar kernel Jupyter
        run: |
          .venv/bin/python -m ipykernel install \
            --user \
            --name actividad2 \
            --display-name "Python Actividad 2"

      # 7. Limpiar el resumen anterior
      - name: Limpiar resumen anterior
        run: |
          rm -f src/carga_datos/resumen_modelos_actividad2.txt

      # 8. Ejecutar notebook de la Actividad 2
      - name: Ejecutar modelos de la Actividad 2
        working-directory: src/carga_datos
        env:
          MPLBACKEND: Agg
        run: |
          ../../.venv/bin/python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          notebooks = list(Path(".").glob("EA2_*.ipynb"))

          if len(notebooks) != 1:
              raise RuntimeError(
                  f"Se esperaba un notebook de Actividad 2 y se encontraron: {notebooks}"
              )

          notebook = notebooks[0]
          print("Notebook encontrado:", notebook, flush=True)

          subprocess.run(
              [
                  sys.executable,
                  "-m", "jupyter", "nbconvert",
                  "--to", "notebook",
                  "--execute",
                  "--ExecutePreprocessor.timeout=1800",
                  "--ExecutePreprocessor.kernel_name=actividad2",
                  "--output", "EA2_ejecutado.ipynb",
                  str(notebook),
              ],
              check=True
          )
          PY

      # 9. Verificar que el resumen se genero
      - name: Verificar resumen automatico
        run: |
          test -s src/carga_datos/resumen_modelos_actividad2.txt
          echo "Resumen generado correctamente"
          echo "Contenido del resumen:"
          cat src/carga_datos/resumen_modelos_actividad2.txt

      # 10. Publicar resultados como artefactos
      - name: Publicar resumen y evidencias
        uses: actions/upload-artifact@v4
        with:
          name: resultados-actividad2
          path: |
            src/carga_datos/resumen_modelos_actividad2.txt
            src/carga_datos/EA2_ejecutado.ipynb
          if-no-files-found: error
          retention-days: 30
