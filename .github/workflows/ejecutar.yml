name: Ejecutar

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ejecutar-main
  cancel-in-progress: false

jobs:
  ejecutar-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Crear entorno virtual
        run: python -m venv .venv

      - name: Instalar dependencias
        run: |
          source .venv/bin/activate
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install pyarrow openpyxl

      - name: Limpiar datos y reportes generados
        run: |
          mkdir -p src/carga_datos/datos src/carga_datos/reportes
          find src/carga_datos/datos -mindepth 1 -delete
          find src/carga_datos/reportes -mindepth 1 -delete

      - name: Ejecutar EA1_Carga_Datos.ipynb
        working-directory: src/carga_datos
        run: |
          source ../../.venv/bin/activate
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            EA1_Carga_Datos.ipynb

      - name: Confirmar cambios generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/carga_datos/datos src/carga_datos/reportes src/carga_datos/EA1_Carga_Datos.ipynb
        

          if git diff --cached --quiet; then
            echo "No se generaron cambios."
            exit 0
          fi

          git commit -m "chore: actualizar resultados de actividad [skip ci]"
          git push origin HEAD:main
